# Free video courses for the Learn page, in two groups: devices and circuits.
# Every link was checked to open the course page. NPTEL courses are free to watch
# (the certificate exam is the only paid part).
#   group:    devices | circuits
#   subject:  the shelf the course sits on (see `subjects` below for the order)
#   level:    Beginner | Intermediate | Advanced (a guide, not a rule)
#   provider: NPTEL | MIT OpenCourseWare | nanoHUB (Purdue)
#   topics:   Device Hub topic ids, so the topic bar can narrow the list

subjects:
  devices:
    - Semiconductor device physics
    - Semiconductor device modeling
    - Power devices
    - Nanoelectronics & fabrication
  circuits:
    - Analog circuits
    - Analog IC design
    - Digital circuits
    - Digital VLSI design

courses:
