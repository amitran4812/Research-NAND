# Free video courses for the Learn page, in two groups: devices and circuits.
# Every link was checked to open the course page (Nov 2026). NPTEL courses are free to
# watch (the certificate exam is the only paid part). Coursera and edX courses are free
# to audit: choose "Audit" / "Enroll for free" and skip the paid certificate.
#   group:    devices | circuits
#   subject:  the shelf the course sits on (see `subjects` below for the order)
#   level:    Beginner | Intermediate | Advanced (a guide, not a rule)
#   provider: NPTEL | MIT OpenCourseWare | nanoHUB (Purdue) | Coursera (free to audit) |
#             edX (free to audit) | YouTube (university lecture recordings)
#   topics:   Device Hub topic ids, so the topic bar can narrow the list

subjects:
  devices:
    - Semiconductor device physics
    - Semiconductor device modeling
    - Memory devices
    - Materials & solid-state physics
    - Power devices
    - Nanoelectronics & fabrication
    - Packaging & integration
  circuits:
    - Analog circuits
    - Analog IC design
    - Data converters & RF ICs
    - Digital circuits
    - Digital VLSI design
    - VLSI CAD, verification & test
    - Computer architecture & memory systems

