# Where to publish: conferences and journals shown on the "Publish" page.
#
# Dates are the *usual* months for each venue. They move a little every year,
# so the site labels them "typical" and links the official page; check the
# call for papers before you plan around a deadline. Edit freely: the next run
# copies this file to site/data/venues.json.
#
# topics: ids from config.yaml, so the topic bar can filter venues.
# Conferences
#   deadline: month (1-12) the full paper / abstract is usually due
#   deadline_note: e.g. "early", "mid", "late" for that month, or extra detail
#   month: month (1-12) the meeting is usually held
#   tier: flagship | major | specialist
# Journals
#   quartile: best Scimago (SJR) category quartile, approximate. It changes
#     yearly and differs by category; the site links Scimago so you can check.
#   type: Letters (short, fast) | Transactions | Journal | Magazine

conferences:
  - name: IEDM
    full: IEEE International Electron Devices Meeting
    deadline: 8
    deadline_note: early (late-news in Sept)
    month: 12
    where: San Francisco, USA
    tier: flagship
    topics: [logic-devices, dram, nand, emerging-memory, materials, dielectrics, interconnects, reliability, modeling, power-devices, process]
    url: https://www.ieee-iedm.org/
    for: "The top venue for new transistors and memory cells: CFET, GAA, 3D DRAM, 3D NAND, FeFET, 2D channels."
  - name: VLSI Symposium
    full: Symposium on VLSI Technology and Circuits
    deadline: 1
    deadline_note: late Jan / early Feb
    month: 6
    where: Kyoto, Japan / Honolulu, USA (alternating)
    tier: flagship
    topics: [logic-devices, dram, nand, emerging-memory, sram, interconnects, process, vlsi, packaging]
    url: https://www.vlsisymposium.org/
    for: "Joint technology + circuits papers; strong on scaled logic, DRAM, SRAM and 3D integration."
  - name: ISSCC
    full: IEEE International Solid-State Circuits Conference
    deadline: 9
    deadline_note: mid
    month: 2
    where: San Francisco, USA
    tier: flagship
    topics: [vlsi, sram, dram, nand, emerging-memory, hbf]
    url: https://www.isscc.org/
    for: "First disclosure of record memory chips (HBM, LPDDR, 3D NAND die) and circuits."
  - name: IMW
    full: IEEE International Memory Workshop
    deadline: 1
    deadline_note: mid
    month: 5
    where: Rotates (Asia / USA / Europe)
    tier: major
    topics: [dram, nand, emerging-memory, reliability, hbf]
    url: https://www.ieee-imw.org/
    for: "The focused memory venue: NAND, DRAM, FeRAM, MRAM, ReRAM, PCM device and reliability work."
  - name: IRPS
    full: IEEE International Reliability Physics Symposium
    deadline: 10
    deadline_note: abstract, early
    month: 3
    where: USA
    tier: major
    topics: [reliability, logic-devices, dram, nand, emerging-memory, dielectrics, interconnects, packaging]
    url: https://www.irps.org/
    for: "BTI, HCI, TDDB, retention, endurance, EM and package reliability."
  - name: ESSERC
    full: European Solid-State Electronics Research Conference
    deadline: 4
    deadline_note: early
    month: 9
    where: Europe
    tier: major
    topics: [logic-devices, emerging-memory, vlsi, modeling, materials]
    url: https://www.esserc.org/
    for: "Devices and circuits together (former ESSDERC + ESSCIRC)."
  - name: DRC
    full: Device Research Conference
    deadline: 2
    deadline_note: late Feb / early Mar
    month: 6
    where: USA
    tier: major
    topics: [logic-devices, materials, emerging-memory, power-devices]
    url: https://www.deviceresearchconference.org/
    for: "Early-stage and exploratory devices: 2D, oxide semiconductors, ferroelectrics."
  - name: EDTM
    full: IEEE Electron Devices Technology and Manufacturing Conference
    deadline: 11
    deadline_note: mid
    month: 3
    where: Asia-Pacific
    tier: major
    topics: [process, logic-devices, dram, nand, emerging-memory, materials, packaging]
    url: https://eds.ieee.org/conferences
    for: "Device technology with a manufacturing angle."
  - name: SISPAD
    full: Simulation of Semiconductor Processes and Devices
