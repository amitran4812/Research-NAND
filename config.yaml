# Hand-picked courses and lecture series that do not change often.
courses:
  - {title: "Semiconductor device fundamentals (nanoHUB-U)", by: "Purdue / nanoHUB", url: "https://nanohub.org/courses", tags: [devices, fundamentals]}
  - {title: "Microelectronic Devices and Circuits (6.012)", by: "MIT OpenCourseWare", url: "https://ocw.mit.edu/search/?q=6.012", tags: [devices, circuits]}
  - {title: "NPTEL courses: VLSI, semiconductor devices, memory", by: "IITs via NPTEL", url: "https://nptel.ac.in/courses", tags: [vlsi, devices]}
  - {title: "IEEE Electron Devices Society webinars & tutorials", by: "IEEE EDS", url: "https://eds.ieee.org/education", tags: [devices, memory]}
  - {title: "imec technology roadmap & talks", by: "imec", url: "https://www.imec-int.com/en/articles", tags: [logic, roadmap]}
  - {title: "Stanford EE online (devices & VLSI)", by: "Stanford Online", url: "https://online.stanford.edu/search-catalog?keywords=semiconductor", tags: [devices, vlsi]}

# Key conferences to watch (shown in the Events section).
conferences:
  - {name: ISSCC, month: February, focus: "Solid-state circuits, memory chips", url: "https://www.isscc.org/"}
  - {name: IMW (Int. Memory Workshop), month: May, focus: "Memory devices & technology", url: "https://www.ieee-imw.org/"}
  - {name: VLSI Symposium, month: June, focus: "Technology & circuits", url: "https://www.vlsisymposium.org/"}
  - {name: FMS (Future of Memory and Storage), month: August, focus: "Flash, DRAM, storage industry", url: "https://futurememorystorage.com/"}
  - {name: Hot Chips, month: August, focus: "Processor & system architecture", url: "https://hotchips.org/"}
  - {name: IEDM, month: December, focus: "Electron devices (CFET, FeFET, 3D DRAM…)", url: "https://www.ieee-iedm.org/"}
